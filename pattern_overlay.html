<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>型態套疊推演 · 南亞科 × 國巨</title>
<style>
  :root{
    --ink:#0a1622; --ink2:#0e1d2e;
    --grid:rgba(120,170,210,0.10); --grid2:rgba(120,170,210,0.045);
    --blue:#5fb4e6; --blue-dim:rgba(95,180,230,0.5);
    --paper:#f3ead6; --yink:#caa86a;
    --amber:#f4a23b; --text:#cdddea; --text-dim:#7d97a9;
    --line:rgba(120,170,210,0.18); --good:#67d28a; --bad:#e8728a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--text);
    font-family:-apple-system,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;overflow:hidden;}
  .mono{font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;}
  #app{display:flex;flex-direction:column;height:100%;}
  header{padding:10px 16px 8px;border-bottom:1px solid var(--line);display:flex;
    align-items:baseline;gap:14px;flex-wrap:wrap;
    background:linear-gradient(180deg,var(--ink2),var(--ink));}
  header h1{font-size:15px;font-weight:650;letter-spacing:.3px;margin:0;}
  header .sub{font-size:11.5px;color:var(--text-dim);}
  header .legend{margin-left:auto;display:flex;gap:14px;font-size:11px;flex-wrap:wrap;}
  .lg{display:flex;align-items:center;gap:6px;color:var(--text-dim);}
  .swatch{width:16px;height:3px;border-radius:2px;display:inline-block;}
  #stage{position:relative;flex:1;min-height:0;}
  canvas{display:block;width:100%;height:100%;cursor:ew-resize;touch-action:none;}
  canvas.drag{cursor:grabbing;}
  #dock{position:absolute;left:14px;bottom:14px;right:14px;display:flex;gap:10px;
    align-items:flex-end;flex-wrap:wrap;pointer-events:none;}
  .panel{pointer-events:auto;background:rgba(10,22,34,0.84);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  #controls{display:flex;flex-direction:column;gap:11px;min-width:250px;}
  .row{display:flex;align-items:center;gap:10px;}
  .row label{font-size:11px;color:var(--text-dim);width:64px;flex:none;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;
    background:var(--line);border-radius:3px;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
    border-radius:50%;background:var(--paper);border:2px solid var(--blue);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;
    background:var(--paper);border:2px solid var(--blue);cursor:pointer;}
  .val{font-size:11px;width:44px;text-align:right;}
  .btns{display:flex;gap:8px;align-items:center;}
  button{font:inherit;font-size:12px;color:var(--text);cursor:pointer;
    background:rgba(95,180,230,0.10);border:1px solid var(--line);border-radius:8px;
    padding:7px 11px;transition:.15s;}
  button:hover{background:rgba(95,180,230,0.2);border-color:var(--blue-dim);}
  button.primary{background:rgba(244,162,59,0.16);border-color:rgba(244,162,59,0.4);color:#ffd9a8;}
  button.primary:hover{background:rgba(244,162,59,0.28);}
  .toggle{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-dim);cursor:pointer;}
  .toggle input{accent-color:var(--blue);}
  #readout{pointer-events:auto;margin-left:auto;min-width:212px;}
  #readout .ttl{font-size:10.5px;letter-spacing:1.6px;color:var(--text-dim);
    text-transform:uppercase;margin-bottom:8px;}
  .stat{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;
    border-bottom:1px dashed var(--line);}
  .stat:last-child{border-bottom:none;}
  .stat .k{font-size:11.5px;color:var(--text-dim);}
  .stat .v{font-size:15px;font-weight:600;}
  .stat .v.big{font-size:20px;color:var(--amber);}
  .hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:11.5px;
    color:var(--text-dim);background:rgba(10,22,34,0.72);padding:6px 13px;border-radius:20px;
    border:1px solid var(--line);pointer-events:none;transition:opacity .5s;backdrop-filter:blur(6px);}
  @media (max-width:720px){
    header .legend{width:100%;margin-left:0;margin-top:6px;}
    #dock{left:8px;right:8px;bottom:8px;flex-direction:column;align-items:stretch;}
    #controls{min-width:0;} #readout{margin-left:0;} .row label{width:58px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>型態套疊推演</h1>
    <span class="sub">南亞科 2408 記憶體型態（模板）× 國巨 2327</span>
    <div class="legend">
      <span class="lg"><span class="swatch" style="background:var(--blue)"></span>南亞科 已走完</span>
      <span class="lg"><span class="swatch" style="background:var(--yink)"></span>國巨 實際</span>
      <span class="lg"><span class="swatch" style="background:var(--amber)"></span>套型態後未來想像</span>
    </div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint">左右拖曳＝在記憶體型態裡前後滑動 · 滾輪縮時間 · 雙指縮放</div>
    <div id="dock">
      <div class="panel" id="controls">
        <div class="row"><label>時間拉伸</label>
          <input type="range" id="sx" min="0.5" max="2.2" step="0.005" value="1">
          <span class="val mono" id="sxv">1.00×</span></div>
        <div class="row"><label>未來幅度</label>
          <input type="range" id="amp" min="0.3" max="2" step="0.005" value="1">
          <span class="val mono" id="ampv">1.00×</span></div>
        <div class="btns">
          <button class="primary" id="fit">自動對齊</button>
          <button id="reset">重置</button>
          <label class="toggle"><input type="checkbox" id="log" checked>對數軸</label>
        </div>
      </div>
      <div class="panel" id="readout">
        <div class="ttl">推 演 讀 數</div>
        <div class="stat"><span class="k">國巨現價</span><span class="v mono" id="r_now">—</span></div>
        <div class="stat"><span class="k">現在 ≈ 南亞科</span><span class="v mono" id="r_align" style="font-size:13px">—</span></div>
        <div class="stat"><span class="k">型態相似度</span><span class="v mono" id="r_corr" style="font-size:13px">—</span></div>
        <div class="stat"><span class="k">推估目標</span><span class="v mono big" id="r_tgt">—</span></div>
        <div class="stat"><span class="k">空間 / 時程</span><span class="v mono" id="r_up" style="font-size:13px">—</span></div>
      </div>
    </div>
  </div>
</div>

  drawPaper(xTip);
  ctx.lineWidth=2.1;ctx.strokeStyle=getCSS('--yink');
  ctx.beginPath();for(let j=0;j<My;j++){const X=xY(j),Yy=sy(yIdx(j));j?ctx.lineTo(X,Yy):ctx.moveTo(X,Yy);}ctx.stroke();
  const cx=xY(My-1),cy=sy(yIdx(My-1));
  ctx.fillStyle=getCSS('--yink');ctx.beginPath();ctx.arc(cx,cy,4.2,0,7);ctx.fill();
  ctx.strokeStyle=getCSS('--paper');ctx.lineWidth=1.4;ctx.stroke();

  updateReadout(tgt);
}

function drawPaper(xTip){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(let j=0;j<My;j++){const X=xY(j),Yy=sy(yIdx(j));
    if(X<minX)minX=X;if(X>maxX)maxX=X;if(Yy<minY)minY=Yy;if(Yy>maxY)maxY=Yy;}
  const pad=12;minX-=pad;maxX+=pad;minY-=pad;maxY+=pad;
  ctx.save();ctx.beginPath();ctx.rect(minX,minY,maxX-minX,maxY-minY);
  ctx.fillStyle='rgba(243,234,214,0.10)';ctx.fill();
  ctx.strokeStyle='rgba(243,234,214,0.28)';ctx.lineWidth=1;ctx.setLineDash([2,3]);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function tagPrice(x,y,price,label){
  const t=label+'  '+fmt(price);ctx.font='12px ui-monospace,monospace';
  const w=ctx.measureText(t).width+14;let bx=x+8,by=y-10;if(bx+w>W-2)bx=x-w-8;
  ctx.fillStyle='rgba(244,162,59,0.16)';roundRect(bx,by,w,20,5);ctx.fill();
  ctx.strokeStyle='rgba(244,162,59,0.5)';ctx.lineWidth=1;roundRect(bx,by,w,20,5);ctx.stroke();
  ctx.fillStyle='#ffd9a8';ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(t,bx+7,by+10.5);
}
function niceTicks(lo,hi,n){const s=hi-lo,raw=s/n,mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const nm=raw/mag;let st=nm<1.5?1:nm<3?2:nm<7?5:10;st*=mag;const o=[];
  for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)o.push(v);return o;}
function drawAxes(){
  // right axis = 国巨 price
  const loP=idxToPrice(useLog?Math.exp(RG.lo):RG.lo), hiP=idxToPrice(useLog?Math.exp(RG.hi):RG.hi);
  const ticks=niceTicks(loP,hiP,6);
  ctx.font='10.5px ui-monospace,monospace';ctx.textBaseline='middle';
  for(const pr of ticks){const idx=pr/NOW*100;const yy=sy(idx);if(yy<PAD.t||yy>H-PAD.b)continue;
    ctx.strokeStyle=getCSS('--grid');ctx.beginPath();ctx.moveTo(PAD.l,yy);ctx.lineTo(W-PAD.r,yy);ctx.stroke();
    ctx.fillStyle=getCSS('--yink');ctx.textAlign='left';ctx.fillText(fmt(pr),W-PAD.r+7,yy);}
  // left axis = index %
  ctx.fillStyle=getCSS('--blue-dim');ctx.textAlign='right';
  for(const pr of ticks){const idx=pr/NOW*100;const yy=sy(idx);if(yy<PAD.t||yy>H-PAD.b)continue;
    ctx.fillText(Math.round(idx)+'',PAD.l-7,yy);}
  ctx.save();ctx.translate(12,PAD.t+plot().h/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';
  ctx.fillStyle=getCSS('--text-dim');ctx.font='10px sans-serif';ctx.fillText('指數 (今日=100)',0,0);ctx.restore();
  ctx.save();ctx.translate(W-12,PAD.t+plot().h/2);ctx.rotate(Math.PI/2);ctx.textAlign='center';
  ctx.fillStyle=getCSS('--text-dim');ctx.font='10px sans-serif';ctx.fillText('國巨 價位',0,0);ctx.restore();
  // bottom: template dates
  ctx.fillStyle=getCSS('--text-dim');ctx.font='10px sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
  const step=Math.ceil(Nn/8);
  for(let i=0;i<Nn;i+=step){ctx.fillText(ND[i].slice(2),xT(i),H-PAD.b+7);}
}
function fmt(v){if(!isFinite(v))return'—';return v>=1000?Math.round(v).toLocaleString():v>=100?v.toFixed(0):v.toFixed(1);}

function updateReadout(tgt){
  document.getElementById('r_now').textContent=fmt(NOW);
  const ai=Math.round(A);
  document.getElementById('r_align').textContent=ND[ai]?ND[ai].slice(2):'—';
  const c=corrAt(A);
  document.getElementById('r_corr').textContent=(c*100).toFixed(0)+'%';
  document.getElementById('r_tgt').textContent=fmt(tgt);
  const up=(tgt/NOW-1)*100;
  const futTd=Math.round((Nn-1-A)*SX); const mo=(futTd/21);
  const el=document.getElementById('r_up');
  el.innerHTML='<span style="color:'+(up>=0?'var(--good)':'var(--bad)')+'">'+(up>=0?'+':'')+up.toFixed(0)+'%</span>'+
    ' <span style="color:var(--text-dim);font-size:11px">· ~'+mo.toFixed(1)+'月</span>';
}

// ---------- interaction ----------
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,a:A};cv.classList.add('drag');
  cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,e);hideHint();});
cv.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId))pts.set(e.pointerId,e);
  if(pinch&&pts.size>=2){const a=[...pts.values()];const f=dist(a[0],a[1])/pinch.d;
    SX=clamp(pinch.sx*f,0.5,2.2);AMP=clamp(pinch.amp*(0.5+0.5*f),0.3,2);sync();draw();return;}
  if(!drag)return;
  A=clamp(drag.a+(e.clientX-drag.x)/dayPx(),WIN-1,Nn-1-1);draw();
});
function up(e){drag=null;cv.classList.remove('drag');pts.delete(e.pointerId);if(pts.size<2)pinch=null;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
let pts=new Map(),pinch=null;
cv.addEventListener('pointerdown',e=>{if(pts.size===2){drag=null;const a=[...pts.values()];
  pinch={d:dist(a[0],a[1]),sx:SX,amp:AMP};}});
function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
cv.addEventListener('wheel',e=>{e.preventDefault();hideHint();const f=Math.exp(-e.deltaY*0.0014);
  if(e.shiftKey)AMP=clamp(AMP*f,0.3,2);else SX=clamp(SX*f,0.5,2.2);sync();draw();},{passive:false});

document.getElementById('sx').addEventListener('input',e=>{SX=+e.target.value;sync(false);draw();});
document.getElementById('amp').addEventListener('input',e=>{AMP=+e.target.value;sync(false);draw();});
document.getElementById('fit').addEventListener('click',()=>{autoFit();flashHint('已套到相似度最高的位置');});
document.getElementById('reset').addEventListener('click',()=>{A=Nn-2;SX=1;AMP=1;sync();draw();});
document.getElementById('log').addEventListener('change',e=>{useLog=e.target.checked;draw();});

function sync(updateSliders=true){
  if(updateSliders){document.getElementById('sx').value=clamp(SX,0.5,2.2);
    document.getElementById('amp').value=clamp(AMP,0.3,2);}
  document.getElementById('sxv').textContent=SX.toFixed(2)+'×';
  document.getElementById('ampv').textContent=AMP.toFixed(2)+'×';
}
let hintTimer;
function hideHint(){document.getElementById('hint').style.opacity=0;}
function flashHint(t){const h=document.getElementById('hint');h.textContent=t;h.style.opacity=1;
  clearTimeout(hintTimer);hintTimer=setTimeout(()=>h.style.opacity=0,2000);}

window.addEventListener('resize',resize);
resize();sync();autoFit();
</script>
</body>
