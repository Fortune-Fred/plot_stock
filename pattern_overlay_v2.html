<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>型態套疊推演 · 記憶體 / 被動元件</title>
<style>
  :root{
    --ink:#0a1622; --ink2:#0e1d2e;
    --grid:rgba(120,170,210,0.10); --grid2:rgba(120,170,210,0.045);
    --blue:#5fb4e6; --blue-dim:rgba(95,180,230,0.5);
    --paper:#f3ead6; --yink:#caa86a;
    --amber:#f4a23b; --text:#cdddea; --text-dim:#7d97a9;
    --line:rgba(120,170,210,0.18); --good:#67d28a; --bad:#e8728a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--text);
    font-family:-apple-system,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;overflow:hidden;}
  .mono{font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;}
  #app{display:flex;flex-direction:column;height:100%;}
  header{padding:9px 16px 8px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--ink2),var(--ink));}
  .htop{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  header h1{font-size:15px;font-weight:650;letter-spacing:.3px;margin:0;}
  header .sub{font-size:11.5px;color:var(--text-dim);}
  .legend{margin-left:auto;display:flex;gap:14px;font-size:11px;flex-wrap:wrap;}
  .lg{display:flex;align-items:center;gap:6px;color:var(--text-dim);}
  .swatch{width:16px;height:3px;border-radius:2px;display:inline-block;}
  /* selector toolbar */
  .tools{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap;align-items:center;}
  .grp{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .grp .tag{font-size:10.5px;letter-spacing:1px;color:var(--text-dim);}
  .grp .tag.b{color:var(--blue);} .grp .tag.o{color:var(--yink);}
  .chip{font:inherit;font-size:11.5px;cursor:pointer;color:var(--text-dim);
    background:transparent;border:1px solid var(--line);border-radius:14px;padding:3px 10px;transition:.13s;}
  .chip:hover{color:var(--text);border-color:var(--blue-dim);}
  .chip.on-b{color:#0a1622;background:var(--blue);border-color:var(--blue);font-weight:600;}
  .chip.on-o{color:#0a1622;background:var(--yink);border-color:var(--yink);font-weight:600;}
  #stage{position:relative;flex:1;min-height:0;}
  canvas{display:block;width:100%;height:100%;cursor:ew-resize;touch-action:none;}
  canvas.drag{cursor:grabbing;}
  #dock{position:absolute;left:14px;bottom:14px;right:14px;display:flex;gap:10px;
    align-items:flex-end;flex-wrap:wrap;pointer-events:none;}
  .panel{pointer-events:auto;background:rgba(10,22,34,0.84);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  #controls{display:flex;flex-direction:column;gap:11px;min-width:250px;}
  .row{display:flex;align-items:center;gap:10px;}
  .row label{font-size:11px;color:var(--text-dim);width:64px;flex:none;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;
    background:var(--line);border-radius:3px;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
    border-radius:50%;background:var(--paper);border:2px solid var(--blue);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;
    background:var(--paper);border:2px solid var(--blue);cursor:pointer;}
  .val{font-size:11px;width:44px;text-align:right;}
  .btns{display:flex;gap:8px;align-items:center;}
  button.act{font:inherit;font-size:12px;color:var(--text);cursor:pointer;
    background:rgba(95,180,230,0.10);border:1px solid var(--line);border-radius:8px;
    padding:7px 11px;transition:.15s;}
  button.act:hover{background:rgba(95,180,230,0.2);border-color:var(--blue-dim);}
  button.primary{background:rgba(244,162,59,0.16);border-color:rgba(244,162,59,0.4);color:#ffd9a8;}
  button.primary:hover{background:rgba(244,162,59,0.28);}
  .toggle{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-dim);cursor:pointer;}
  .toggle input{accent-color:var(--blue);}
  #readout{pointer-events:auto;margin-left:auto;min-width:212px;}
  #readout .ttl{font-size:10.5px;letter-spacing:1.6px;color:var(--text-dim);
    text-transform:uppercase;margin-bottom:8px;}
  .stat{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;
    border-bottom:1px dashed var(--line);}
  .stat:last-child{border-bottom:none;}
  .stat .k{font-size:11.5px;color:var(--text-dim);}
  .stat .v{font-size:15px;font-weight:600;}
  .stat .v.big{font-size:20px;color:var(--amber);}
  .hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:11.5px;
    color:var(--text-dim);background:rgba(10,22,34,0.72);padding:6px 13px;border-radius:20px;
    border:1px solid var(--line);pointer-events:none;transition:opacity .5s;backdrop-filter:blur(6px);}
  @media (max-width:760px){
    .legend{width:100%;margin-left:0;margin-top:6px;}
    #dock{left:8px;right:8px;bottom:8px;flex-direction:column;align-items:stretch;}
    #controls{min-width:0;} #readout{margin-left:0;} .row label{width:58px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="htop">
      <h1>型態套疊推演</h1>
      <span class="sub">記憶體 / 被動元件 型態類比</span>
      <div class="legend">
        <span class="lg"><span class="swatch" style="background:var(--blue)"></span><span id="lg-t">模板</span></span>
        <span class="lg"><span class="swatch" style="background:var(--yink)"></span><span id="lg-o">疊圖</span></span>
        <span class="lg"><span class="swatch" style="background:var(--amber)"></span>未來想像</span>
      </div>
    </div>
    <div class="tools">
      <div class="grp"><span class="tag b">模板（底圖）</span><span id="grp-t"></span></div>
      <div class="grp"><span class="tag o">疊圖（可滑動）</span><span id="grp-o"></span></div>
    </div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint">左右拖曳＝在模板型態裡前後滑動 · 滾輪縮時間 · 雙指縮放</div>
    <div id="dock">
      <div class="panel" id="controls">
        <div class="row"><label>時間拉伸</label>
          <input type="range" id="sx" min="0.5" max="2.2" step="0.005" value="1">
          <span class="val mono" id="sxv">1.00×</span></div>
        <div class="row"><label>未來幅度</label>
          <input type="range" id="amp" min="0.3" max="2" step="0.005" value="1">
          <span class="val mono" id="ampv">1.00×</span></div>
        <div class="btns">
          <button class="act primary" id="fit">自動對齊</button>
          <button class="act" id="reset">重置</button>
          <label class="toggle"><input type="checkbox" id="log" checked>對數軸</label>
        </div>
      </div>
      <div class="panel" id="readout">
        <div class="ttl">推 演 讀 數</div>
        <div class="stat"><span class="k" id="r_nowk">現價</span><span class="v mono" id="r_now">—</span></div>
        <div class="stat"><span class="k" id="r_alignk">現在 ≈</span><span class="v mono" id="r_align" style="font-size:13px">—</span></div>
        <div class="stat"><span class="k">型態相似度</span><span class="v mono" id="r_corr" style="font-size:13px">—</span></div>
        <div class="stat"><span class="k">推估目標</span><span class="v mono big" id="r_tgt">—</span></div>
        <div class="stat"><span class="k">空間 / 時程</span><span class="v mono" id="r_up" style="font-size:13px">—</span></div>
      </div>
    </div>
  </div>
</div>

  const k=(n*sxy-sx*sy)/(n*sxx-sx*sx),b=(sy-k*sx)/n;return a.map((v,i)=>v-(k*i+b));}

  ORDER.forEach(k=>{
    const a=document.createElement('button');a.className='chip'+(k===tKey?' on-b':'');a.textContent=S[k].n;
    a.onclick=()=>{if(k===oKey)oKey=tKey;tKey=k;selChanged();};gt.appendChild(a);
    const b=document.createElement('button');b.className='chip'+(k===oKey?' on-o':'');b.textContent=S[k].n;
    b.onclick=()=>{if(k===tKey)tKey=oKey;oKey=k;selChanged();};go.appendChild(b);
  });
  document.getElementById('lg-t').textContent=S[tKey].n+' 模板';
  document.getElementById('lg-o').textContent=S[oKey].n+' 疊圖';
}
function selChanged(){applySel();buildChips();autoFit();}

// ---- interaction ----
let drag=null,pts=new Map(),pinch=null;
function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
cv.addEventListener('pointerdown',e=>{pts.set(e.pointerId,e);
  if(pts.size===2){drag=null;const a=[...pts.values()];pinch={d:dist(a[0],a[1]),sx:SX,amp:AMP};}
  else{drag={x:e.clientX,a:A};cv.classList.add('drag');}
  cv.setPointerCapture(e.pointerId);hideHint();});
cv.addEventListener('pointermove',e=>{if(pts.has(e.pointerId))pts.set(e.pointerId,e);
  if(pinch&&pts.size>=2){const a=[...pts.values()];const f=dist(a[0],a[1])/pinch.d;
    SX=clamp(pinch.sx*f,0.5,2.2);AMP=clamp(pinch.amp*(0.5+0.5*f),0.3,2);sync();draw();return;}
  if(!drag)return;A=clamp(drag.a+(e.clientX-drag.x)/dayPx(),WIN-1,Nn-1-1);draw();});
function up(e){drag=null;cv.classList.remove('drag');pts.delete(e.pointerId);if(pts.size<2)pinch=null;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();hideHint();const f=Math.exp(-e.deltaY*0.0014);
  if(e.shiftKey)AMP=clamp(AMP*f,0.3,2);else SX=clamp(SX*f,0.5,2.2);sync();draw();},{passive:false});
document.getElementById('sx').addEventListener('input',e=>{SX=+e.target.value;sync(false);draw();});
document.getElementById('amp').addEventListener('input',e=>{AMP=+e.target.value;sync(false);draw();});
document.getElementById('fit').addEventListener('click',()=>{autoFit();flashHint('已套到相似度最高的位置');});
document.getElementById('reset').addEventListener('click',()=>{A=Nn-2;SX=1;AMP=1;sync();draw();});
document.getElementById('log').addEventListener('change',e=>{useLog=e.target.checked;draw();});
function sync(u=true){if(u){document.getElementById('sx').value=clamp(SX,0.5,2.2);document.getElementById('amp').value=clamp(AMP,0.3,2);}
  document.getElementById('sxv').textContent=SX.toFixed(2)+'×';document.getElementById('ampv').textContent=AMP.toFixed(2)+'×';}
let hintTimer;function hideHint(){document.getElementById('hint').style.opacity=0;}
function flashHint(t){const h=document.getElementById('hint');h.textContent=t;h.style.opacity=1;clearTimeout(hintTimer);hintTimer=setTimeout(()=>h.style.opacity=0,2000);}

window.addEventListener('resize',resize);
applySel();buildChips();resize();sync();autoFit();
</script>
</body>
</html>
